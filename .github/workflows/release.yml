name: Release Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web-build:
    name: Build Web (Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Upload web artifact (for Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    name: Deploy Web to GitHub Pages
    runs-on: ubuntu-latest
    needs: web-build
    continue-on-error: true
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  desktop-build:
    name: Build Desktop (Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Collect desktop artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          if (-not (Test-Path release)) {
            throw "release folder was not created by desktop build"
          }

          $setupExe = Get-ChildItem -Path release -Recurse -File -Include *Setup*.exe | Select-Object -First 1
          $setupMsi = Get-ChildItem -Path release -Recurse -File -Include *.msi | Select-Object -First 1

          $setup = $setupExe
          if ($null -eq $setup) {
            $setup = $setupMsi
          }

          if ($null -eq $setup) {
            throw "Installer artifact not found (expected Setup exe or msi)"
          }

          Copy-Item $setup.FullName -Destination artifacts -Force

          Get-FileHash -Path artifacts\* -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path | Split-Path -Leaf)"
          } | Set-Content -Path artifacts\checksums.txt

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: artifacts
          if-no-files-found: error

  firebase-deploy:
    name: Deploy Web to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (root base)
        run: npm run build:firebase
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPING_TEST_FREE }}
          projectId: typing-test-free
          channelId: live

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: ${{ always() && needs.desktop-build.result == 'success' }}
    needs:
      - deploy-web
      - firebase-deploy
      - desktop-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release version
        id: version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG="v${PKG_VERSION}"
          # Public web app is served from Firebase Hosting.
          WEB_URL="https://typing-test-free.web.app"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-builds
          path: release-assets

      - name: Ensure assets folder exists
        run: mkdir -p release-assets

      - name: Validate and prepare release assets
        id: assets
        shell: bash
        run: |
          ls -la release-assets
          test -n "$(find release-assets -maxdepth 1 -type f \( -name '*Setup*.exe' -o -name '*.msi' \) | head -n 1)"

          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f \( -name '*Setup*.exe' -o -name '*.msi' -o -name 'checksums.txt' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release files found in release-assets"
            exit 1
          fi

          {
            echo "files<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## TypingTest ${{ steps.version.outputs.pkg_version }}

            - 🌐 Web pública: [Abrir aplicación web](${{ steps.version.outputs.web_url }})
            - 🪟 Instalador Windows: archivo con nombre TypingTest-Setup-<version>.exe
            - 🔐 Verificación: checksums.txt (SHA256)

            Commit: ${{ github.sha }}
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true

      - name: Setup Node for version bump
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push
